# duration behavior
duration_target_s: 4620       # Target ≈ 77 minutes (CD-length mixtape)
duration_cap_s: 4800          # Absolute max = 1h20m
target_track_count: 16        # Target length (approx 16 tracks)
track_min_duration_s: 60      # Skip tracks shorter than 1 minute
track_max_duration_s: 600     # Skip tracks longer than 10 minutes


music_library_path: "C:\\Users\\ericl\\Music\\tPod V3\\iTunes Media\\Music"

max_tracks_per_artist: 1

# Interview
max_questions: 10
conf_thresh: 0.7

# Repair loop
ambitious_threshold: 0.88     # Aim high first
accept_threshold: 0.80        # Fallback floor
max_repair_iters: 8
eps: 0.01
stall_iters: 2

# Model Tiering (v2.1.1)
fast_llm_model: "gpt-4o-mini"
smart_llm_model: "gpt-4o"

# Guardrails
off_topic_max: 3

# A/B retry
max_ab_rounds: 3

# Scoring weights (v2.1.1) — RYM ratings heavily weighted
w_fit: 0.30
w_flow: 0.15
w_variety: 0.10
w_access: 0.15
w_quality: 0.30

# Base-and-Branch behavior
branch_swap_min: 2
branch_swap_max: 5
branch_variety_boost: 0.2

# RNG (deterministic in testing)
rng_seed: 12345

# Spotify export
spotify_add_chunk_size: 100
spotify_playlist_public_default: false

# Evaluation harness
log_sim_user_transcripts: true

# LLM Settings
default_llm_model: "gpt-4o"
llm_temperature_default: 0.2
eval_models: ["gpt-4o", "claude-3-5-sonnet-20240620"]
